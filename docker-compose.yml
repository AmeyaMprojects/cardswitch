services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cardswitch
      POSTGRES_USER: cardswitch
      POSTGRES_PASSWORD: cardswitch
    ports: ["5432:5432"]
    volumes:
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardswitch"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["9092:9092"]

  gateway:
    build: ./services/gateway
    environment:
      LISTEN_ADDR: ":8080"
      REDIS_ADDR: redis:6379
      SWITCH_URL: http://auth-switch:8081
      VAULT_URL: http://tokenization-vault:8083
    ports: ["8080:8080"]
    depends_on: [redis, auth-switch, tokenization-vault]

  auth-switch:
    build: ./services/auth-switch
    environment:
      LISTEN_ADDR: ":8081"
      KAFKA_BOOTSTRAP: kafka:9092
      LEDGER_URL: http://ledger:8084
      ISSUER_TIMEOUT_MS: "800"
      ISSUER_MAX_RETRIES: "2"
    ports: ["8081:8081"]
    depends_on: [kafka, issuer-sim, ledger]

  issuer-sim:
    build: ./services/issuer-sim
    environment:
      LISTEN_ADDR: ":8082"
      ISSUER_LATENCY_MS: "${ISSUER_LATENCY_MS:-20}"
      ISSUER_FAIL_RATE: "${ISSUER_FAIL_RATE:-0}"
    ports: ["8082:8082"]

  tokenization-vault:
    build: ./services/tokenization-vault
    environment:
      # Dev-only keys so the stack runs out of the box. Override in .env; never reuse in production.
      VAULT_MASTER_KEY: "${VAULT_MASTER_KEY:-QGMVQTcei5+uW0e9JFKpHZ7FCXnlqKH6b5ALjBk43Sw=}"
      VAULT_HMAC_KEY: "${VAULT_HMAC_KEY:-VGwpV8SMlV2dV9v8q6rHZyzBCW9TUVAmuNQe2JuKfHA=}"
      DB_URL: jdbc:postgresql://postgres:5432/cardswitch
    ports: ["8083:8083"]
    depends_on:
      postgres: { condition: service_healthy }

  ledger:
    build: ./services/ledger
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/cardswitch
    ports: ["8084:8084"]
    depends_on:
      postgres: { condition: service_healthy }

  settlement:
    build: ./services/settlement
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/cardswitch
      KAFKA_BOOTSTRAP: kafka:9092
    ports: ["8085:8085"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
