server.port=8085
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cardswitch}
spring.datasource.username=${DB_USER:cardswitch}
spring.datasource.password=${DB_PASSWORD:cardswitch}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.consumer.group-id=settlement
spring.kafka.consumer.auto-offset-reset=earliest

# Batches cover fixed windows; a batch closes once its window has ended.
settlement.window-minutes=${SETTLEMENT_WINDOW_MINUTES:5}
settlement.close-check-ms=${SETTLEMENT_CLOSE_CHECK_MS:30000}
settlement.ledger-url=${LEDGER_URL:http://localhost:8084}
