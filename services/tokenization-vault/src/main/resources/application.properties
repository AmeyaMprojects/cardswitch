server.port=8083
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cardswitch}
spring.datasource.username=${DB_USER:cardswitch}
spring.datasource.password=${DB_PASSWORD:cardswitch}

# Base64-encoded 256-bit keys. Dev values come from docker-compose; use a KMS in real deployments.
vault.master-key=${VAULT_MASTER_KEY:}
vault.hmac-key=${VAULT_HMAC_KEY:}
# Services allowed to turn a token back into a PAN (sent as X-Caller-Service).
vault.detokenize-callers=${VAULT_DETOKENIZE_CALLERS:issuer-connector}
